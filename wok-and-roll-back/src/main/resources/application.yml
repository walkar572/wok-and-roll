spring:
  application:
    name: wok-and-roll-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wokroll}
    username: ${DB_USERNAME:wokroll}
    password: ${DB_PASSWORD:wokroll}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the schema is created only by Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # The request id (X-Request-Id, #152) after the level, for example: ERROR [qa-bug-152]
    level: "%5p [%X{requestId:-}]"
